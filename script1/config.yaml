# ============================================================
# Конфигурация уникализации CMS
# ============================================================

# --- Источник и назначение ---
source:
  path: "./muhomor-spb"

  # Не копировать вообще (служебные папки и логи)
  exclude:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".idea"
    - ".vscode"
    - "logs"
    - "reports"
    - "*.log"

  # Копировать как есть, НЕ кастомизировать (админка и сторонние библиотеки)
  skip_process:
    - "admin.php"
    - "admin.js"
    - "jquery-3.6.0.min.js"
    - "summernote-lite.js"
    - "summernote-lite.min.js"
    - "summernote-ru-RU.js"
    - "summernote"

destination:
  path: "./muhomor-msk"
  overwrite: false
  backup_before_overwrite: true

# --- Уникализация классов ---
unique:
  prefix: "msk"
  mode: "safe"                     # safe | aggressive

# --- Обрабатываемые файлы ---
files:
  extensions: [".php", ".css", ".js", ".html", ".htm"]
  encoding:
    read: "utf-8"
    fallback: "cp1251"
    write: "utf-8"

# ============================================================
# УДАЛЕНИЕ КОММЕНТАРИЕВ
# ============================================================

# HTML-комментарии: <!-- ... -->
html:
  remove_comments: true            # Удалять HTML-комментарии
  keep_conditional: true           # Оставить <!--[if IE]> ... <![endif]-->
  
  # Перемешивание блоков на главной
  shuffle_index_blocks: true       # Перемешивать блоки в index.php
  fixed_first_block: "Hero"        # Блок, который всегда первый
  shuffle_blocks:                  # Блоки, которые перемешиваются
    - "Преимущества"
    - "Популярные товары"
    - "Превью блога"
    - "Превью новостей"
    - "Блок акций"
    - "Блок отзывов"

# CSS-комментарии: /* ... */
css:
  remove_comments: true            # Удалять CSS-комментарии
  keep_important: true             # Оставить /*! ... */ (важные)

# ============================================================
# СПИСОК КЛАССОВ, КОТОРЫЕ НЕ ЗАМЕНЯЕМ
# ============================================================
