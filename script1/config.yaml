# ============================================================
# ЛОГИРОВАНИЕ И ОТЧЁТ
# ============================================================
logging:
  enabled: true
  level: "INFO"
  file: "logs/customize_{date}.log"
  console: true

report:
  enabled: true
  file: "reports/report_{prefix}_{date}.json"
  include_replaced: true